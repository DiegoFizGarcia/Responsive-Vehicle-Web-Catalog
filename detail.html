<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <title>Model Details</title>
    <link href="assets/stylesheets/detail.css" rel="stylesheet" type="text/css">
    <style>
      .specs-container {
        margin-top: 20px;
        padding: 20px;
        background-color: #f5f5f5;
        border-radius: 8px;
        display: none;
      }
      .specs-container.show {
        display: block;
        animation: slideDown 0.3s ease-out;
      }
      @keyframes slideDown {
        from { opacity: 0; transform: translateY(-10px);}
        to   { opacity: 1; transform: translateY(0);}
      }
      .specs-list { list-style: none; padding: 0; margin: 0; }
      .specs-list li {
        padding: 12px 0;
        border-bottom: 1px solid #ddd;
        font-size: 15px;
        color: #010205;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .specs-list li:last-child { border-bottom: none; }
      .spec-key {
        font-weight: 600;
        color: #010205;
        flex: 0 0 auto;
        min-width: 200px;
      }
      .spec-value {
        color: #535457;
        text-align: right;
        flex: 1;
        padding-left: 20px;
      }
      .toggle-specs {
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #010205;
        color: #eeeff2;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        transition: background-color 0.3s ease;
      }
      .toggle-specs:hover { background-color: #333; }
      .card {
        position: relative;
      }
      h3 {
        margin-top: 0;
        margin-bottom: 15px;
        color: #010205;
        border-bottom: 2px solid #010205;
        padding-bottom: 10px;
      }
      /* Catalog button style */
      .card a {
        text-decoration: none;
        background-color: var(--color-text);
        color: var(--color-background);
        text-align: center;
        padding: 8px 12px;
        display: inline-block;
        border-radius: 4px;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        margin-top: 20px;
      }
      .card a:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
      }
      /* fadeInRightBig animation for the card */
      .fade-in-right-big {
        animation: fadeInRightBig 800ms cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
      }
      @keyframes fadeInRightBig {
        0% {
          opacity: 0;
          transform: translateX(2000px);
        }
        100% {
          opacity: 1;
          transform: translateX(0);
        }
      }
    </style>
  </head>

  <body>
    <!-- Header -->
    <header>
        <img src="assets/images/logo1.png" alt="Porsche Logo" id="logo" />
    </header>

    <!-- Hero -->
    <section>
        <div class="card">
          <h2 id="modelName">911</h2>
          <img id="modelImage" src="assets/images/logo2.png" alt="Porsche 911" />
          <p id="modelDesc">The iconic rear-engine sports car with the highest performance.</p>
          <div class="specs-container" id="specsContainer">
            <h3>Technical Specifications</h3>
            <ul class="specs-list" id="specsList"></ul>
          </div>
          <button class="toggle-specs" id="toggleButton">View technical specifications</button>
          <a href="index.html" id="backLink">View catalog</a>
        </div>
    </section>

    <!-- Footer -->
    <footer>
      <span>© 2025 Diego Fiz García</span>
    </footer>

    <script>
      // fadeInRightBig entrance animation
      document.addEventListener('DOMContentLoaded', function () {
        const card = document.querySelector('.card');
        if (card) card.classList.add('fade-in-right-big');
      });

      // Function to read URL parameters
      function obtenerParametroURL(nombre) {
        const url = new URL(window.location);
        return url.searchParams.get(nombre);
      }
      // Get values from URL
      const modelName = obtenerParametroURL('id') || '911';
      const modelImg = obtenerParametroURL('img') || 'logo2.png';
      const modelDesc = obtenerParametroURL('desc') || 'Description not available';
      const specsParam = obtenerParametroURL('specs') || '';
      document.getElementById('modelName').textContent = modelName;
      document.getElementById('modelImage').src = 'assets/images/' + modelImg;
      document.getElementById('modelImage').alt = modelName;
      document.getElementById('modelDesc').textContent = modelDesc;

      // Process technical specifications
      if (specsParam) {
        const decodedSpecs = decodeURIComponent(specsParam);
        const specs = decodedSpecs.split('|');
        const specsList = document.getElementById('specsList');
        specsList.innerHTML = '';
        specs.forEach(spec => {
          if (spec.trim()) {
            const colonIndex = spec.indexOf(':');
            if (colonIndex > -1) {
              const key = spec.substring(0, colonIndex).trim();
              const value = spec.substring(colonIndex + 1).trim();
              const li = document.createElement('li');
              li.innerHTML = `
                <span class="spec-key">${key}:</span>
                <span class="spec-value">${value}</span>
              `;
              specsList.appendChild(li);
            }
          }
        });
      }

      // Toggle specifications
      const toggleButton = document.getElementById('toggleButton');
      const specsContainer = document.getElementById('specsContainer');
      toggleButton.addEventListener('click', function() {
        specsContainer.classList.toggle('show');
        toggleButton.textContent = specsContainer.classList.contains('show')
          ? 'Hide technical specifications'
          : 'View technical specifications';
      });
    </script>
  </body>
</html>
